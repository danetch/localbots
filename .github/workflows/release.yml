# Build the Windows installer and publish it as a GitHub Release when a version tag is pushed (git tag v0.2.0 && git push --tags).
# The installer is NOT code signed: Windows SmartScreen will warn until a certificate is added (CSC_LINK / CSC_KEY_PASSWORD secrets).
name: release
on:
  push:
    tags: ['v*']
jobs:
  win:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm test
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
