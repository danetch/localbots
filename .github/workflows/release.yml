# Release = push to main with a new "version" in package.json. If release v<version> does not exist yet, the tests run (Linux), then the
# Windows installer is built and published as GitHub release v<version> (electron-builder also uploads latest.yml for the in-app updater).
# The installer is NOT code signed: Windows SmartScreen warns until a certificate is added (CSC_LINK / CSC_KEY_PASSWORD secrets).
# Beta versions (x.y.z-beta.N, usually from a season* branch) are published as GitHub pre-releases: only users who ticked "Offer beta
# versions" get them. A season* branch never publishes a full release (its version must contain "-").
name: release
on:
  push:
    branches: [main, 'season*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" != "main" ] && [[ "$v" != *-* ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; echo "::notice::branch ${GITHUB_REF_NAME}: full versions are released from main only"; exit 0; fi
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
  test:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: npm test
        shell: bash
        run: npm test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: grep -E "^not ok|error:|expected|actual|Error|at .*test" -A2 test-output.txt | head -60 | while IFS= read -r l; do echo "::error::$l"; done
  win:
    needs: [check, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Pre-release for beta versions
        shell: bash
        run: node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json'));if(p.version.includes('-')){p.build.publish[0].releaseType='prerelease';fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('pre-release',p.version)}"
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
