<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a3866"/><stop offset="1" stop-color="#0b1022"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/><stop offset=".45" stop-color="#d9a441"/><stop offset="1" stop-color="#7a5212"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff0bf"/><stop offset=".5" stop-color="#e9b955"/><stop offset="1" stop-color="#a87422"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d2ff"/><stop offset="1" stop-color="#b061f2"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2fd6"/><stop offset="1" stop-color="#4a1590"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#rim)" stroke-width="18"/>
  <rect x="40" y="40" width="432" height="432" rx="76" fill="none" stroke="#e9b955" stroke-opacity=".18" stroke-width="3"/>
  <!-- rising bars -->
  <g>
    <rect x="104" y="300" width="78" height="128" rx="10" fill="url(#bar)"/>
    <rect x="217" y="236" width="78" height="192" rx="10" fill="url(#bar)"/>
    <rect x="330" y="186" width="78" height="242" rx="10" fill="url(#bar)"/>
    <rect x="96" y="428" width="320" height="12" rx="6" fill="#d9a441"/>
  </g>
  <!-- epic gem above the tallest bar -->
  <circle cx="369" cy="112" r="62" fill="#b061f2" opacity=".55" filter="url(#glow)"/>
  <g transform="translate(369 112)">
    <polygon points="0,-62 52,-14 0,66 -52,-14" fill="url(#gemR)"/>
    <polygon points="0,-62 -52,-14 0,66" fill="url(#gemL)"/>
    <polygon points="0,-62 26,-14 0,66 -26,-14" fill="#c98af7" opacity=".55"/>
    <polygon points="-52,-14 52,-14 0,-62" fill="#f6e6ff" opacity=".55"/>
    <polygon points="0,-62 52,-14 0,66 -52,-14" fill="none" stroke="#fbeaff" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <!-- sparkle -->
  <path d="M150 128 l9 27 27 9 -27 9 -9 27 -9 -27 -27 -9 27 -9z" fill="#ffe7a3"/>
</svg>
